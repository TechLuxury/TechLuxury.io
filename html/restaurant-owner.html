<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة المطعم | Tech Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="../css/restaurant-owner.css">
</head>
<body>
    <div class="owner-container">
        <h1>لوحة إدارة المطعم</h1>

        <div class="dashboard-grid">
            <!-- قسم إضافة الموظفين -->
            <div class="box">
                <h3>إضافة موظف (كاشير)</h3>
                <p class="note">اطلب من الموظف إنشاء حساب في الموقع أولاً، ثم ضع الـ UID الخاص به هنا. يمكنه الحصول عليه من صفحة الملف الشخصي أو من لوحة تحكم Firebase.</p>
                
                <div class="input-group">
                    <input type="text" id="staffUid" placeholder="UID الموظف (مثال: aB3dE...)">
                </div>
                <div class="input-group">
                    <input type="text" id="staffName" placeholder="اسم الموظف (للتوضيح)">
                    <button onclick="addStaff()">إضافة موظف</button>
                </div>
            </div>

            <!-- قسم عرض الموظفين -->
            <div class="box">
                <h3>الموظفين الحاليين</h3>
                <ul class="staff-list" id="staffList">
                    <li style="justify-content: center; color: var(--text-muted);">جاري التحميل...</li>
                </ul>
            </div>
        </div>
    </div>

    <script type="module" src="../js/restaurant-owner.js"></script>
</body>
</html>
