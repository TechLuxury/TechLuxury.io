<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة المطعم | Tech Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background: #090d16; color: #fff; font-family: 'Tajawal', sans-serif; padding: 20px; }
        .box { background: #131c2e; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        input, button { padding: 10px; border-radius: 5px; border: none; margin-bottom: 10px; }
        input { background: #0d1424; color: #fff; border: 1px solid #2a3b5c; width: 60%; }
        button { background: #22c55e; color: #fff; cursor: pointer; font-weight: bold; }
        ul { list-style: none; padding: 0; }
        li { background: #1e293b; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <h1>لوحة إدارة المطعم</h1>

    <div class="box">
        <h3>إضافة موظف (كاشير)</h3>
        <p style="font-size: 12px; color: #94a3b8;">اطلب من الموظف إنشاء حساب في الموقع أولاً، ثم ضع الـ UID الخاص به هنا.</p>
        <input type="text" id="staffUid" placeholder="UID الموظف (من Firebase)">
        <input type="text" id="staffName" placeholder="اسم الموظف">
        <button onclick="addStaff()">إضافة موظف</button>
    </div>

    <div class="box">
        <h3>الموظفين الحاليين</h3>
        <ul id="staffList">جاري التحميل...</ul>
    </div>

    <script type="module" src="../js/restaurant-owner.js"></script>
</body>
</html>
