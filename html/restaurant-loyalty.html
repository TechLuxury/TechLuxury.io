<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة الولاء | Tech Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="../css/restaurant-loyalty.css">
</head>
<body>
    <div class="loyalty-card">
        <h2>برنامج الولاء</h2>
        <p class="subtitle">أدخل رقم هاتفك لعرض نقاطك ومكافآتك</p>
        
        <input type="tel" id="phoneInput" placeholder="07XXXXXXXX">
        <button id="btnShow">عرض النقاط</button>
        
        <div class="points-display" id="pointsDisplay">
            <div class="points-circle">
                <span class="points-val" id="pointsVal">0</span>
                <span class="points-label">نقطة</span>
            </div>
        </div>
    </div>

    <script type="module" src="../js/restaurant-loyalty.js"></script>
</body>
</html>
