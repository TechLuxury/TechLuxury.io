<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الكاشير | Tech Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="../css/restaurant-staff.css">
</head>
<body>
    <div class="staff-container">
        <h2>لوحة الكاشير</h2>
        
        <div class="staff-grid">
            <!-- القسم الأيمن: البحث -->
            <div>
                <input type="text" id="customerPhone" placeholder="رقم هاتف الزبون أو كود العضوية">
                <button id="btnSearch">بحث عن الزبون</button>
                
                <p class="error-msg" id="errorMsg"></p>

                <div class="customer-info" id="customerInfo">
                    <p>اسم الزبون: <strong id="custName">-</strong></p>
                    <p>الرصيد الحالي:</p>
                    <span class="points" id="custPoints">0</span> نقطة
                </div>
            </div>

            <!-- القسم الأيسر: الفاتورة -->
            <div>
                <div class="invoice-section" id="invoiceSection">
                    <h3 style="margin-top:0;">تفاصيل الفاتورة</h3>
                    <input type="number" id="invoiceAmount" placeholder="مبلغ الفاتورة (دينار)">
                    <button id="btnAddPoints" style="background: var(--success);">تأكيد وإضافة النقاط</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/restaurant-staff.js"></script>
</body>
</html>
