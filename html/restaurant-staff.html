<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الكاشير | Tech Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #090d16; color: #fff; font-family: 'Tajawal', sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #131c2e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2a3b5c; background: #0d1424; color: #fff; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #1e3a8a; cursor: not-allowed; }
        .customer-info { display: none; background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-right: 4px solid #3b82f6; }
        .points { font-size: 24px; color: #fbbf24; font-weight: bold; }
        .error { color: #ef4444; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center; margin-top:0;">لوحة الكاشير</h2>
        
        <input type="text" id="customerPhone" placeholder="رقم هاتف الزبون أو كود العضوية">
        <button id="btnSearch">بحث عن الزبون</button>

        <div class="customer-info" id="customerInfo">
            <p>اسم الزبون: <strong id="custName">-</strong></p>
            <p>الرصيد الحالي: <span class="points" id="custPoints">0</span> نقطة</p>
        </div>

        <div id="invoiceSection" style="display:none; margin-top:20px; border-top: 1px solid #2a3b5c; padding-top:20px;">
            <input type="number" id="invoiceAmount" placeholder="مبلغ الفاتورة (دينار)">
            <button id="btnAddPoints">تأكيد وإضافة النقاط</button>
        </div>
        
        <p class="error" id="errorMsg"></p>
    </div>

    <script type="module" src="../js/restaurant-staff.js"></script>
</body>
</html>
