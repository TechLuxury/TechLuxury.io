<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Tech Luxury Business</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fa-solid fa-briefcase"></i>
                <h2>Tech Luxury Business</h2>
                <p>تسجيل الدخول للمؤسسات</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="email@example.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">دخول</button>
            </form>
            <div class="auth-footer">
                <p>ليس لديك حساب؟ <a href="register.html">إنشاء مؤسسة جديدة</a></p>
            </div>
        </div>
    </div>
    <script type="module">
        import { login } from '../core/auth.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الدخول...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                await login(email, password);
                window.location.href = "../dashboard/index.html";
            } catch (error) {
                console.error(error);
                alert("❌ خطأ: البريد الإلكتروني أو كلمة المرور غير صحيحة");
                btn.disabled = false;
                btn.innerText = 'دخول';
            }
        });
    </script>
</body>
</html>
