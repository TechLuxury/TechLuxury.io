<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الكروت - Tech Luxury Business</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-briefcase"></i>
            <span>Tech Luxury Business</span>
        </div>
        <div class="nav-user">
            <a href="index.html" class="btn-secondary">العودة للرئيسية</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <main class="main-content" style="width: 100%;">
            <header class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>إدارة الكروت</h1>
                    <p>عرض، إنشاء، وإدارة كروت مؤسستك.</p>
                </div>
                <button id="btnCreateCard" class="btn-primary"><i class="fa-solid fa-plus"></i> إنشاء كرت جديد</button>
            </header>

            <!-- Modal لإنشاء كرت -->
            <div id="createCardModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close-modal" id="closeModal">&times;</span>
                    <h2>إنشاء كرت جديد</h2>
                    <p>اختر نوع الكرت الذي تريد إنشاءه:</p>
                    <div class="card-types-grid" id="cardTypesGrid">
                        <!-- سيتم ملؤها ديناميكياً من الـ Registry -->
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>اسم الكرت</th>
                            <th>النوع</th>
                            <th>Card ID</th>
                            <th>الحالة</th>
                            <th>تاريخ الإنشاء</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="cardsTableBody">
                        <tr><td colspan="6" style="text-align:center;">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="dashboard-cards.js"></script>
</body>
</html>
