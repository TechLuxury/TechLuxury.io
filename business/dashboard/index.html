<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - Tech Luxury Business</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-briefcase"></i>
            <span>Tech Luxury Business</span>
        </div>
        <div class="nav-user">
            <span id="orgNameDisplay">جاري التحميل...</span>
            <button id="logoutBtn" class="btn-logout"><i class="fa-solid fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul>
                <li class="active"><a href="index.html"><i class="fa-solid fa-home"></i> الرئيسية</a></li>
                <li><a href="cards.html"><i class="fa-solid fa-id-card"></i> إدارة الكروت</a></li>
                <li><a href="#"><i class="fa-solid fa-chart-line"></i> الإحصائيات</a></li>
                <li><a href="#"><i class="fa-solid fa-cog"></i> الإعدادات</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>مرحباً، <span id="managerNameDisplay"></span></h1>
                <p>إليك نظرة سريعة على مؤسستك.</p>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fa-solid fa-id-card"></i>
                    <div>
                        <h3>إجمالي الكروت</h3>
                        <p id="totalCards">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-check-circle" style="color: #22c55e;"></i>
                    <div>
                        <h3>الكروت النشطة</h3>
                        <p id="activeCards">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-pause-circle" style="color: #f59e0b;"></i>
                    <div>
                        <h3>الكروت المعطلة</h3>
                        <p id="disabledCards">0</p>
                    </div>
                </div>
            </div>

            <div class="recent-section">
                <h2>آخر الكروت التي تم إنشاؤها</h2>
                <div id="recentCards" class="cards-list">
                    <p>جاري التحميل...</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
