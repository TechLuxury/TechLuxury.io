<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المطعم - Tech Luxury Business</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <a href="../../dashboard/index.html" style="color: inherit; text-decoration: none;">
                <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
            </a>
            <span>| إدارة المطعم</span>
        </div>
        <div class="nav-actions">
            <a href="public.html?id=CARD_ID" id="previewLink" target="_blank" class="btn-secondary"><i class="fa-solid fa-eye"></i> معاينة الصفحة</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <ul>
                <li class="active" data-tab="info"><a href="#"><i class="fa-solid fa-store"></i> معلومات المطعم</a></li>
                <li data-tab="categories"><a href="#"><i class="fa-solid fa-list"></i> الأقسام</a></li>
                <li data-tab="products"><a href="#"><i class="fa-solid fa-burger"></i> المنتجات</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- قسم المعلومات -->
            <section id="tab-info" class="tab-content active">
                <h1>معلومات المطعم</h1>
                <form id="restaurantInfoForm" class="form-grid">
                    <div class="form-group">
                        <label>اسم المطعم</label>
                        <input type="text" id="infoName" required>
                    </div>
                    <div class="form-group">
                        <label>رابط الشعار (Logo URL)</label>
                        <input type="url" id="infoLogo">
                    </div>
                    <div class="form-group">
                        <label>رابط صورة الغلاف (Cover URL)</label>
                        <input type="url" id="infoCover">
                    </div>
                    <div class="form-group full-width">
                        <label>وصف المطعم</label>
                        <textarea id="infoDesc" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="text" id="infoPhone">
                    </div>
                    <div class="form-group">
                        <label>رقم الواتساب</label>
                        <input type="text" id="infoWhatsapp">
                    </div>
                    <div class="form-group">
                        <label>العنوان</label>
                        <input type="text" id="infoAddress">
                    </div>
                    <div class="form-group">
                        <label>رابط خرائط جوجل (Google Maps)</label>
                        <input type="url" id="infoMaps">
                    </div>
                    <div class="form-group full-width">
                        <label>أوقات العمل</label>
                        <input type="text" id="infoHours" placeholder="مثال: يومياً من 10 صباحاً حتى 12 منتصف الليل">
                    </div>
                                      <div class="form-group">
                        <label>تقييم جوجل (مثال: 4.8)</label>
                        <input type="number" step="0.1" max="5" id="infoRating" placeholder="4.8">
                    </div>
                    <div class="form-group">
                        <label>عدد المراجعات (مثال: 150)</label>
                        <input type="number" id="infoReviewsCount" placeholder="150">
                    </div>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-save"></i> حفظ المعلومات</button>
                </form>
            </section>

            <!-- قسم الأقسام -->
            <section id="tab-categories" class="tab-content">
                <div class="header-actions">
                    <h1>إدارة الأقسام</h1>
                    <button class="btn-primary" onclick="openCategoryModal()"><i class="fa-solid fa-plus"></i> إضافة قسم</button>
                </div>
                <div class="list-container" id="categoriesList">
                    <!-- سيتم ملؤها بالكود -->
                </div>
            </section>

            <!-- قسم المنتجات -->
            <section id="tab-products" class="tab-content">
                <div class="header-actions">
                    <h1>إدارة المنتجات</h1>
                    <button class="btn-primary" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> إضافة منتج</button>
                </div>
                <div class="list-container" id="productsList">
                    <!-- سيتم ملؤها بالكود -->
                </div>
            </section>

        </main>
    </div>

    <!-- Modal (لإضافة وتعديل الأقسام والمنتجات) -->
    <div id="globalModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
