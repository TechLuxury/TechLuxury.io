<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الكاشير - نقاط الولاء</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-cash-register"></i>
            <span>نظام الكاشير</span>
        </div>
        <a href="dashboard.html?id=CARD_ID" id="backToDash" class="btn-secondary">العودة للإدارة</a>
    </nav>

    <div class="container" style="margin-top: 30px;">
        <div class="form-grid" style="grid-template-columns: 1fr; gap: 30px;">
            
            <!-- قائمة الانتظار -->
            <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
                <h2 style="margin-bottom: 20px;"><i class="fa-solid fa-users"></i> الزبائن في الانتظار</h2>
                <div id="queueList" style="display: flex; flex-direction: column; gap: 10px;">
                    <p class="text-muted text-center">لا يوجد زبائن حالياً...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal لإدخال الفاتورة -->
    <div id="invoiceModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal" onclick="closeInvoiceModal()">&times;</span>
            <h2>إضافة نقاط للعميل</h2>
            <h3 id="selectedCustomerName" style="color: var(--primary); margin: 10px 0 20px;"></h3>
            
            <form id="invoiceForm">
                <div class="form-group">
                    <label>قيمة الفاتورة (د.أ)</label>
                    <input type="number" id="invoiceAmount" step="0.01" min="0.1" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>رقم الفاتورة (اختياري)</label>
                    <input type="text" id="invoiceRef" placeholder="REF-123">
                </div>
                
                <div style="background: rgba(245, 158, 11, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <p style="color: var(--primary); font-weight: bold;">
                        النقاط المتوقعة: <span id="expectedPoints">0</span> نقطة
                    </p>
                    <p style="font-size: 0.8rem; color: var(--text-muted);">(يتم احتساب 10 نقاط لكل 1 د.أ)</p>
                </div>

                <button type="submit" class="btn-primary" id="confirmBtn" style="width: 100%;">تأكيد وإضافة النقاط</button>
            </form>
        </div>
    </div>

    <script type="module" src="pos.js"></script>
</body>
</html>
