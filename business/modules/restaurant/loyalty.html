<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقاطي - برنامج الولاء</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="public-body" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0f172a;">
    
    <div class="container" style="max-width: 500px; width: 90%;">
        <div class="modal-content" style="text-align: center; background: #fff; padding: 40px 20px; border-radius: 20px;">
            
            <div style="margin-bottom: 20px;">
                <i class="fa-solid fa-award" style="font-size: 3.5rem; color: #f59e0b;"></i>
            </div>
            <h2 style="font-size: 1.8rem; margin-bottom: 10px;">مرحباً، <span id="custName">...</span></h2>
            <p style="color: #64748b; margin-bottom: 30px;">برنامج الولاء - <span id="restName">...</span></p>
            
            <div class="points-display" style="background: linear-gradient(135deg, #f59e0b, #d97706); padding: 30px; border-radius: 16px; color: #fff; box-shadow: 0 10px 20px rgba(217, 119, 6, 0.3); margin-bottom: 30px;">
                <p style="font-size: 1.1rem; margin-bottom: 5px; opacity: 0.9;">رصيدك الحالي</p>
                <h1 id="currentPoints" style="font-size: 4rem; margin: 0; font-weight: 800;">0</h1>
                <p style="font-size: 1rem; opacity: 0.9;">نقطة</p>
            </div>

            <div style="text-align: right;">
                <h3 style="margin-bottom: 15px; font-size: 1.1rem;"><i class="fa-solid fa-clock-rotate-left"></i> سجل النقاط الأخير</h3>
                <div id="transactionsList" style="max-height: 200px; overflow-y: auto;">
                    <p style="color: #94a3b8; text-align: center;">لا توجد عمليات سابقة</p>
                </div>
            </div>

            <button class="btn-secondary" style="width: 100%; margin-top: 30px;" onclick="logoutCustomer()">تسجيل الخروج</button>
        </div>
    </div>

    <script type="module" src="loyalty-customer.js"></script>
</body>
</html>
