<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقاطي - برنامج الولاء</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="public-body" style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    
    <div class="container" style="max-width: 400px; width: 90%;">
        <div class="modal-content" style="text-align: center; background: #fff; padding: 40px 20px;">
            
            <!-- حالة الانتظار -->
            <div id="waitingState">
                <i class="fa-solid fa-hourglass-half fa-spin" style="font-size: 4rem; color: #f59e0b; margin-bottom: 20px;"></i>
                <h2>مرحباً، <span id="customerNameDisplay"></span></h2>
                <p class="text-muted" style="margin-top: 10px; font-size: 1.1rem;">
                    يرجى إخبار الكاشير باسمك للحصول على نقاطك.
                </p>
                <div class="status-badge" style="margin-top: 20px; background: #fef3c7; color: #92400e; padding: 10px; border-radius: 8px;">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> في انتظار الكاشير...
                </div>
            </div>

            <!-- حالة إضافة النقاط -->
            <div id="successState" style="display: none;">
                <i class="fa-solid fa-circle-check" style="font-size: 4rem; color: #22c55e; margin-bottom: 20px;"></i>
                <h2>تمت إضافة النقاط!</h2>
                <p class="text-muted" style="margin-top: 10px;">شكراً لزيارتك.</p>
                
                <div class="points-display" style="background: #f0fdf4; border: 2px dashed #22c55e; padding: 20px; border-radius: 12px; margin-top: 20px;">
                    <p style="color: #166534; margin-bottom: 5px;">رصيدك الحالي</p>
                    <h1 id="currentPoints" style="font-size: 3rem; color: #22c55e; margin: 0;">0</h1>
                    <p style="color: #166534; font-size: 0.9rem;">نقطة</p>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="loyalty-customer.js"></script>
</body>
</html>
